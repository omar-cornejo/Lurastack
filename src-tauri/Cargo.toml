[package]
name = "ddf"
version = "0.1.0"
description = "DDF — visual Terraform editor with bidirectional HCL generation"
authors = ["Omar Cornejo <omarcornejovargas@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/omar-cornejo/ddfib"
homepage = "https://github.com/omar-cornejo/ddfib"
keywords = ["terraform", "iac", "visual-editor", "tauri"]
categories = ["development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ddf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0", features = ["full"] }
portable-pty = "0.8"
anyhow = "1.0.95"
hcl-rs = "0.19.5"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2"
dirs = "6"
