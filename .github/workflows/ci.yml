name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Least-privilege token for all jobs by default.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (npm ci + build + audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (locked, no scripts)
        env:
          # .npmrc already sets ignore-scripts=true; double-belted here for clarity.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test (vitest + coverage report)
        # Coverage is informational only — reported in the job log, never gated.
        # Running with --coverage executes the same suite once, so no extra time.
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Audit (high+ production only — blocks release)
        run: npm run audit

      - name: Audit (moderate, all — informational, never blocks)
        run: npm run audit:all || true

  rust:
    name: Rust (cargo --locked + audit + deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (locked)
        run: cargo check --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (locked)
        run: cargo test --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo deny check
        run: cargo deny check advisories licenses sources

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright, mocked backend)
    runs-on: ubuntu-latest
    # Non-blocking for now: browser E2E is inherently flakier than unit tests,
    # and the existing gate is deliberately contributor-friendly. Promote to a
    # required check (drop continue-on-error) once it has proven stable.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (locked, no scripts)
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --ignore-scripts

      # The predev hook is skipped by --ignore-scripts; the templates index is
      # needed by the app, so build it explicitly.
      - name: Build templates index
        run: npm run templates:index

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
