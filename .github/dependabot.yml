version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri-plugins:
        patterns:
          - "@tauri-apps/*"
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@tauri-apps/*"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@tauri-apps/*"
    versioning-strategy: increase

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri-plugins:
        patterns:
          - "tauri"
          - "tauri-*"
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
