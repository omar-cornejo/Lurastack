name: Feature request
description: Suggest an idea or improvement for LuraStack
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it.
        For non-trivial features, consider opening a discussion first so we can align on scope before anyone invests real time.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the current pain point or limitation. "I'm always frustrated when..." is a good start.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen. Mockups or examples are very welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas / visual editor
        - HCL generation / bidirectional sync
        - Provider catalog (AWS / GCP / Azure)
        - Templates gallery
        - Diff / Cloud views
        - Embedded terminal
        - Credentials / security
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us understand the request.
